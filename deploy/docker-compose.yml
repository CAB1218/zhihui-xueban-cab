services:
  # ============ 前端 ============
  frontend:
    image: nginx:1.25-alpine
    container_name: ai4edu-frontend
    ports:
      - "80:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/conf.d/default.http.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ai4edu-network

  # ============ 后端 ============
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ai4edu-backend
    ports:
      - "8000:8000"
    env_file:
      # backend/.env 不入库（含 API Key）。缺失时回退到 app/config.py 默认值，
      # 容器内的 host 相关配置由下方 environment 覆盖，因此没有 .env 也能启动。
      - path: ../backend/.env
        required: false
    environment:
      - POSTGRES_HOST=postgres
      - NEO4J_URI=bolt://neo4j:7687
      - CLICKHOUSE_HOST=clickhouse
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=121.43.129.181
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai4edu-network

  # ============ Celery Worker ============
  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ai4edu-celery-worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    env_file:
      # backend/.env 不入库（含 API Key）。缺失时回退到 app/config.py 默认值，
      # 容器内的 host 相关配置由下方 environment 覆盖，因此没有 .env 也能启动。
      - path: ../backend/.env
        required: false
    environment:
      - POSTGRES_HOST=postgres
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=121.43.129.181
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
      - CLICKHOUSE_HOST=clickhouse
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai4edu-network

  # ============ Celery Beat ============
  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ai4edu-celery-beat
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      # backend/.env 不入库（含 API Key）。缺失时回退到 app/config.py 默认值，
      # 容器内的 host 相关配置由下方 environment 覆盖，因此没有 .env 也能启动。
      - path: ../backend/.env
        required: false
    environment:
      - POSTGRES_HOST=postgres
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=121.43.129.181
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
      - CLICKHOUSE_HOST=clickhouse
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai4edu-network

  # ============ PostgreSQL ============
  postgres:
    image: postgres:16-alpine
    container_name: ai4edu-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ai4edu
      POSTGRES_USER: ai4edu
      POSTGRES_PASSWORD: ai4edu_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai4edu"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai4edu-network

  # ============ Neo4j ============
  neo4j:
    image: neo4j:5.20
    container_name: ai4edu-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - ai4edu-network

  # ============ ClickHouse ============
  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: ai4edu-clickhouse
    ports:
      - "8123:8123"
      - "9001:9000"
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse_password
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password clickhouse_password --query 'SELECT 1'"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - ai4edu-network

  # ============ Redis ============
  redis:
    image: redis:7-alpine
    container_name: ai4edu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai4edu-network

  # ============ Elasticsearch ============
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: ai4edu-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - ai4edu-network

  # ============ MinIO ============
  minio:
    # 注意：官方 minio/minio 镜像已于 2025 年从 Docker Hub 下架（pull 会 403），
    # 改用 Bitnami 打包的同版本 minio 服务端（API、控制台端口与用法完全一致）
    image: bitnamilegacy/minio:latest
    container_name: ai4edu-minio
    user: "0:0"   # 数据卷由 root 创建，需以 root 运行才能初始化
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DATA_DIR: /data
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai4edu-network

# ============ 数据卷 ============
volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  clickhouse_data:
    driver: local
  redis_data:
    driver: local
  es_data:
    driver: local
  minio_data:
    driver: local

# ============ 网络 ============
networks:
  ai4edu-network:
    driver: bridge
